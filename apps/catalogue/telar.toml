[telar]
# "auto" draws with the GPU where there is one and the CPU where there is not.
backend = "auto"
# Crates whose components every `.rsx` file sees without a `use`.
prelude = ["telar_components"]

[telar.dev.window]
title = "catalogue"
width = 1000
height = 700

[telar.previews]
include = ["telar-components", "telar-navigate"]

# The face every snapshot sets its text in, so goldens match on any machine.
[[telar.fonts]]
family = "Telar Test"
src = "../../crates/renderer/renderer-text/test-fonts/TelarTest.ttf"
axes = { wght = [100, 900], opsz = [14, 32] }
