[telar]
backend = "auto"
# Root for baked `src:"..."` assets, relative to the package. Defaults to "assets"; e.g. "src/shared/assets".
# assets = "assets"

[telar.dev]
devtools = true

[telar.dev.window]
title = "sandbox"
width = 1200
height = 1200
decorations = true
resizable = true
transparent = false
fullscreen = "disabled"
position = "centered"

# A face the app ships: embedded for a native shaper, hashed with an `@font-face` and a preload on the web.
[[telar.fonts]]
family = "Telar Test"
src = "assets/fonts/TelarTest.ttf"
axes = { wght = [100, 900], opsz = [14, 32] }
size_adjust = 1.0
