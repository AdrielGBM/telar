[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
rsx = { workspace = true, features = ["dynamic-svg", "components", "navigate"] }
serde.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
# Mirrors the feature `cargo rsx dev` injects, so the hot-reload integration test can gate on it.
dev = ["rsx/dev"]

[dev-dependencies]
platform-core = { workspace = true }
platform-headless.workspace = true

[package.metadata.android]
package = "com.example.rsx.sandbox"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 36

[package.metadata.android.application.activity]
# uiMode added so an OS dark/light change is handled in-process instead of recreating the NativeActivity,
# which tears down the wgpu surface and hangs. The other three match cargo-apk's default configChanges.
config_changes = "orientation|keyboardHidden|screenSize|uiMode"
