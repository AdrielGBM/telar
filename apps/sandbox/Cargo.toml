[package]
name = "sandbox"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
# The frontend is this app's `default` to choose rather than telar's — the workspace turns telar's own off.
# Everything named here is what the app needs whichever frontend it runs on; the rest is under `[features]`.
telar = { workspace = true, features = [
    "runtime",
    "dynamic-svg",
    "components",
    "navigate",
] }
serde = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["desktop"]
# A window, drawn by the GPU where there is one and the CPU where there is not.
desktop = ["telar/desktop", "telar/hardware", "telar/software"]
# Mirrors the feature `cargo telar dev` injects, so the hot-reload integration test can gate on it.
dev = ["telar/dev"]
# Runs the same app in the terminal. `TELAR_TARGET=tui` picks it when the desktop frontend is also compiled in.
tui = ["telar/tui"]
# The browser, both ways it can draw. Only meaningful for a wasm32 build.
web = ["telar/web"]
# The browser drawing as a document alone: no GPU, no shaper, and no faces to carry for one.
web-dom = ["telar/web-dom"]

[dev-dependencies]
criterion = "0.8.2"
platform-core = { workspace = true }
platform-headless = { workspace = true }
pollster = "1.0.1"
renderer-core.workspace = true
renderer-hardware.workspace = true
renderer-software.workspace = true
renderer-text.workspace = true
renderer-tui.workspace = true
ui-core.workspace = true

[[bench]]
name = "frontend_frame"
harness = false

[package.metadata.android]
package = "com.example.telar.sandbox"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 36

[package.metadata.android.application.activity]
# uiMode added so an OS dark/light change is handled in-process instead of recreating the NativeActivity,
# which tears down the wgpu surface and hangs. The other three match cargo-apk's default configChanges.
config_changes = "orientation|keyboardHidden|screenSize|uiMode"
