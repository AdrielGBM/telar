[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
# dynamic-svg (implies svg): demo_svgs.rs builds SvgData with `from_str` at runtime, so it needs usvg.
rsx = { workspace = true, features = ["runtime", "dynamic-svg"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
platform-core.workspace = true

[package.metadata.android]
package = "com.example.rsx.sandbox"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 36
