[package]
name = "telar-renderer-dom"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Document renderer for Telar: a frame reconciled into real DOM elements laid out by CSS."
keywords = ["telar", "web", "wasm", "dom", "renderer"]
categories = ["wasm", "gui", "web-programming"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
geometry-core = { workspace = true }
platform-core = { workspace = true }
renderer-core = { workspace = true }

rustc-hash = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "NodeList", "TextMetrics", "CssStyleDeclaration", "Document", "DomRect", "Element", "AddEventListenerOptions", "EventTarget", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "HtmlHeadElement", "Node", "Text", "Window", "Location", "FocusEvent", "FontFaceSet", "MouseEvent", "HtmlAnchorElement", "NamedNodeMap", "Attr", "HtmlCollection"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys.workspace = true
layout-core = { workspace = true }
platform-web.workspace = true
reactive-core.workspace = true
ui-core.workspace = true
ui-tree.workspace = true
wasm-bindgen-futures.workspace = true

# Pinned to the release whose glue and `wasm-bindgen-test-runner` match the `wasm-bindgen` pin in [workspace.dependencies]. The two move together.
wasm-bindgen-test = "=0.3.77"
web-sys = { workspace = true, features = ["KeyboardEventInit", "EventInit", "NodeList", "FocusEvent", "FontFace", "FontFaceSet", "Blob", "BlobPropertyBag", "Url", "MouseEvent", "MouseEventInit", "PointerEvent", "PointerEventInit", "MutationObserver", "MutationObserverInit", "MutationRecord"] }

[[test]]
name = "layout_parity"
path = "src/layout_parity_test.rs"

[[test]]
name = "keyboard"
path = "src/keyboard_test.rs"

[[test]]
name = "blend"
path = "src/blend_test.rs"

[[test]]
name = "semantics"
path = "src/semantics_test.rs"

[[test]]
name = "controls"
path = "src/controls_test.rs"

[[test]]
name = "document_scroll"
path = "src/document_scroll_test.rs"

[[test]]
name = "font_load"
path = "src/font_load_test.rs"

[[test]]
name = "font_variation"
path = "src/font_variation_test.rs"

[[test]]
name = "links"
path = "src/links_test.rs"

[[test]]
name = "picture"
path = "src/picture_test.rs"

[[test]]
name = "prerender_parity"
path = "src/prerender_parity_test.rs"

[[test]]
name = "hydration"
path = "src/hydration_test.rs"

[[test]]
name = "reactive_layout"
path = "src/reactive_layout_test.rs"

[[test]]
name = "fixed_layer"
path = "src/fixed_layer_test.rs"

[[test]]
name = "dash"
path = "src/dash_test.rs"

[[test]]
name = "transform_origin"
path = "src/transform_origin_test.rs"

[[test]]
name = "drawn_box"
path = "src/drawn_box_test.rs"

[[test]]
name = "text_paint"
path = "src/text_paint_test.rs"

[[test]]
name = "current"
path = "src/current_test.rs"

[[test]]
name = "arrival_margin"
path = "src/arrival_margin_test.rs"
