[package]
name = "telar-renderer-dom"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Document renderer for Telar: a frame reconciled into real DOM elements laid out by CSS."
keywords = ["telar", "web", "wasm", "dom", "renderer"]
categories = ["wasm", "gui", "web-programming"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
geometry-core = { workspace = true }
platform-core = { workspace = true }
reactive-local = { workspace = true }
renderer-core = { workspace = true }

rustc-hash = { workspace = true }
tracing = { workspace = true }
unicode-linebreak = "0.1.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "NodeList", "TextMetrics", "CssStyleDeclaration", "Document", "DomRect", "Element", "AddEventListenerOptions", "EventTarget", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "HtmlHeadElement", "Node", "Text", "Window", "Location", "FocusEvent", "FontFaceSet", "MouseEvent", "HtmlAnchorElement", "NamedNodeMap", "Attr", "HtmlCollection", "CompositionEvent"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]

i18n-core = { workspace = true }
js-sys = { workspace = true }
layout-core = { workspace = true }
platform-web = { workspace = true }
reactive-core = { workspace = true }
ui-core = { workspace = true }
ui-tree = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["KeyboardEventInit", "EventInit", "NodeList", "FocusEvent", "FontFace", "FontFaceSet", "Blob", "BlobPropertyBag", "Url", "MouseEvent", "MouseEventInit", "PointerEvent", "PointerEventInit", "MutationObserver", "MutationObserverInit", "MutationRecord", "Range", "CompositionEvent", "CompositionEventInit", "InputEventInit"] }

[[test]]
name = "layout_parity"
path = "src/layout_parity.test.rs"

[[test]]
name = "keyboard"
path = "src/keyboard.test.rs"

