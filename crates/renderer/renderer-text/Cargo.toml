[package]
name = "telar-renderer-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Text shaping, glyph atlas and COLR glyph rendering for Telar, built on cosmic-text."
keywords = ["telar", "text", "font", "shaping", "rendering"]
categories = ["rendering", "text-processing", "graphics"]
readme.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clru = { workspace = true }
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
fontdb = "0.23"
etagere = "0.3.0"
geometry-core = { workspace = true }
lru = { workspace = true }
renderer-core = { workspace = true }
rustc-hash = { workspace = true }
skrifa = "0.43"
tiny-skia = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "colr_text"
harness = false
