[package]
name = "telar-renderer-web"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Browser renderer for Telar: a canvas surface and the wgpu backend that draws into it."
keywords = ["telar", "web", "wasm", "wgpu", "webgpu"]
categories = ["wasm", "rendering", "web-programming"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
renderer-core = { workspace = true }

tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
platform-core = { workspace = true }
renderer-hardware = { workspace = true }
renderer-text = { workspace = true }

js-sys = { workspace = true }
raw-window-handle = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["CanvasRenderingContext2d", "CssStyleDeclaration", "Document", "Element", "HtmlCanvasElement", "HtmlImageElement", "ImageData", "HtmlElement", "HtmlLinkElement", "Navigator", "Node", "NodeList", "Response", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
geometry-core.workspace = true
wasm-bindgen-test = "=0.3.77"
