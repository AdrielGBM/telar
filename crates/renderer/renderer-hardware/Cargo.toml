[package]
name = "telar-renderer-hardware"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "wgpu-based GPU renderer for Telar with path tessellation, blur and compositing."
keywords = ["telar", "renderer", "wgpu", "gpu", "graphics"]
categories = ["rendering::engine", "rendering::graphics-api", "graphics"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
renderer-core = { workspace = true }
raw-window-handle = { workspace = true }
wgpu = "30"
pollster = "1.0.1"
bytemuck = { workspace = true, features = ["derive"] }
renderer-text = { workspace = true }
lyon = "1.0.19"
tracing = { workspace = true }
geometry-core = { workspace = true }
rustc-hash = { workspace = true }
renderer-cache = { workspace = true }
lru = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"
platform-headless = { workspace = true }

[[bench]]
name = "render_frame"
harness = false

# `fragile-send-sync-non-atomic-wasm` makes wgpu's browser handles — which wrap JS objects in `Rc` — count as
# `Send + Sync`. Sound only because a wasm build without the `atomics` feature has exactly one thread, so
# nothing ever crosses one; without it every process-wide slot in this crate stops compiling there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Window", "CssStyleDeclaration"]
