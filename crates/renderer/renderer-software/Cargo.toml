[package]
name = "telar-renderer-software"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CPU rasterizer for Telar, built on tiny-skia, with software surface presentation."
keywords = ["telar", "renderer", "software", "rasterizer", "2d"]
categories = ["rendering::engine", "graphics", "gui"]
readme.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer-core = { workspace = true }
softbuffer = "0.4"
raw-window-handle = { workspace = true }
tiny-skia = { workspace = true, features = ["simd"] }
renderer-text = { workspace = true }
geometry-core = { workspace = true }
rustc-hash = { workspace = true }
wide = { workspace = true }
rayon = "1"
smallvec = { workspace = true }
tracing.workspace = true
renderer-cache.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["nativewindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = "0.9"
rustix = { version = "1.1", features = ["fs"] }
wayland-client = "0.31"

[dev-dependencies]
criterion = "0.8.2"
geometry-core = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
layout-core = { workspace = true }
platform-core = { workspace = true }
platform-headless = { workspace = true }
reactive-core = { workspace = true }
ui-components = { workspace = true }
ui-core = { workspace = true }
ui-tree = { workspace = true }

[[bench]]
name = "render_frame"
harness = false
