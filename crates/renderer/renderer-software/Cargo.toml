[package]
name = "telar-renderer-software"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "CPU rasterizer for Telar, built on tiny-skia, with software surface presentation."
keywords = ["telar", "renderer", "software", "rasterizer", "2d"]
categories = ["rendering::engine", "graphics", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
geometry-core = { workspace = true }
renderer-cache = { workspace = true }
renderer-core = { workspace = true }
renderer-text = { workspace = true }

raw-window-handle = { workspace = true }
rayon = "1"
rustc-hash = { workspace = true }
smallvec = { workspace = true }
# Without `kms`: presenting to a bare DRM device is not a surface Telar ever asks for, and it carries drm + rustix.
softbuffer = { version = "0.4", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
tiny-skia = { workspace = true, features = ["simd"] }
tracing = { workspace = true }
wide = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["nativewindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = "0.9"
rustix = { version = "1.1", features = ["fs"] }
wayland-client = "0.31"

[dev-dependencies]
geometry-core = { workspace = true }
layout-core = { workspace = true }
platform-core = { workspace = true }
platform-headless = { workspace = true }
reactive-core = { workspace = true }
ui-components = { workspace = true }
ui-core = { workspace = true }
ui-tree = { workspace = true }

criterion = { workspace = true }
image = { workspace = true, features = ["png"] }

[[bench]]
name = "render_frame"
harness = false
