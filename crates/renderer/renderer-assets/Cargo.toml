[package]
name = "telar-renderer-assets"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Decodes SVG and raster assets into Telar's drawing vocabulary, at runtime or baked at build time."
keywords = ["telar", "svg", "image", "assets", "rendering"]
categories = ["rendering::data-formats", "multimedia::images", "graphics"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
renderer-core = { workspace = true }
geometry-core = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# Both stripped to their cores, because their defaults are a whole text stack — see `svg-text` below for
# what that costs and who should pay it.
resvg = { version = "0.48", optional = true, default-features = false }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
usvg = { version = "0.48", optional = true, default-features = false }

[features]
# usvg/resvg for the runtime dynamic SVG path (`from_str`). The build-time baker lives behind `bake`, not this.
#
# `raster-images` comes with it rather than as a knob of its own: a parser that drops the `<image>` elements
# it is pointed at, silently and only at runtime, is a latent bug rather than a size/features trade the
# person enabling SVG parsing is in a position to make.
dynamic-svg = ["dep:usvg", "dep:resvg", "resvg/raster-images"]

# The build-time bakers (`bake_to_source`, `bake_image_to_source`), host-only: everything the runtime path
# above can parse, plus every format `image` ships, so a baked asset never fails for a format the app itself
# never turned on. The transpiler enables this to bake `src:"…"` assets without putting usvg/image in the app
# binary.
#
# The only thing left that reaches for `image` here. Decoding a bitmap at *runtime* is `telar-dynamic`'s
# `ImageDecoder`, which calls `image` itself and carries the per-format knobs that used to live here.
bake = ["dynamic-svg", "svg-text", "dep:image", "image/default-formats"]

# `<text>` in an SVG parsed at *runtime*. Off by default, and the reason is what it weighs: shaping a glyph
# needs a shaper, a font database and an outline rasterizer — harfrust, fontdb, skrifa and read_fonts — which
# came to 1.6MB of the sandbox's wasm module, most of it for a feature its icons never used.
#
# Only the runtime path is affected. The baker runs on the host with everything on, so an SVG baked at build
# time keeps its text either way, which is where most SVG in an application comes from. Fails the way the
# `image-*` knobs do: text in a runtime SVG is dropped rather than refusing to compile, because which
# features an SVG uses is not knowable until the string arrives.
svg-text = ["usvg?/text", "resvg?/text"]
