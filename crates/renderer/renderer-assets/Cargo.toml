[package]
name = "telar-renderer-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Decodes SVG and PNG/JPEG assets into Telar's drawing vocabulary, at runtime or baked at build time."
keywords = ["telar", "svg", "image", "assets", "rendering"]
categories = ["rendering::data-formats", "multimedia::images", "graphics"]
readme.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer-core = { workspace = true }
geometry-core = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
resvg = { version = "0.48", optional = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
usvg = { version = "0.48", optional = true }

[features]
# usvg/resvg. Enables the runtime dynamic SVG path (`from_str`) AND the build-time baker (`bake_to_source`); the transpiler turns this on host-side so baking is always available without putting usvg in the app binary.
dynamic-svg = ["dep:usvg", "dep:resvg"]
# The `image` crate: runtime decode (`decode`) plus the build-time image baker (`bake_image_to_source`), host-only same as `dynamic-svg`.
dynamic-image = ["dep:image"]
