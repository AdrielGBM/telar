[package]
name = "hot-panic-guest"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `shaper` because the host test binary has it, and the boundary fingerprints it: a guest without it would ignore the font database `HostServices` hands it, so it is refused as a layout mismatch.
telar = { path = "../../..", default-features = false, features = ["dev", "shaper"] }
telar-components = { version = "0.2.2", path = "../../../../../plugins/telar-components" }
telar-icons = { version = "0.2.2", path = "../../../../../plugins/telar-icons" }
# The seam a face that arrives while the app runs goes through, as `telar-dynamic`'s font decoder does.
telar-renderer-text = { version = "0.2.2", path = "../../../../renderer/renderer-text" }

# Its own workspace root, so it is never a member of the repository's: the `hot_panic` test builds it on demand.
[workspace]
