[package]
name = "telar"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A modular Rust UI framework with its own template language, reactive signals and a self-contained renderer."
keywords = ["ui", "gui", "framework", "reactive", "declarative"]
categories = ["gui", "rendering", "graphics"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

# docs.rs builds with everything on so the whole surface is visible: a default-features build documents a
# desktop app and silently hides the terminal, browser and Android frontends. `--cfg docsrs` is what turns
# on the per-item "Available on crate feature ..." badges.

[[test]]
name = "component"
path = "src/component_test.rs"

[[test]]
name = "devtools_seam"
path = "src/devtools_seam_test.rs"

[[test]]
name = "frame_budget"
path = "src/frame_budget_test.rs"

[[test]]
name = "headless_multi_surface"
path = "src/headless_multi_surface_test.rs"

[[test]]
name = "headless_pixels"
path = "src/headless_pixels_test.rs"

[[test]]
name = "headless_spawn_task"
path = "src/headless_spawn_task_test.rs"

[[test]]
name = "installed_renderer"
path = "src/installed_renderer_test.rs"

[[test]]
name = "local_tree_repaints"
path = "src/local_tree_repaints_test.rs"

[[test]]
name = "max_width_wrapping"
path = "src/max_width_wrapping_test.rs"

[[test]]
name = "path_lays_out"
path = "src/path_lays_out_test.rs"

[[test]]
name = "text_style_baseline"
path = "src/text_style_baseline_test.rs"

[[test]]
name = "texture_ui"
path = "src/texture_ui_test.rs"

[[test]]
name = "theme_repaints"
path = "src/theme_repaints_test.rs"

[[test]]
name = "watch_path"
path = "src/watch_path_test.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["desktop"]

#! ## Targets
#!
#! One feature per surface Telar draws on, and **each is complete on its own** — naming it is the whole of
#! the choice. Most applications enable exactly one and never touch another feature on this page.
#! `cargo telar new --target <name>` writes it for you.
#!
#! | Feature | Surface | Crates in the build graph |
#! | --- | --- | --- |
#! | `desktop` | A native window on Linux, macOS and Windows *(default)* | 397 |
#! | `tui` | The terminal the app was launched from | 102 |
#! | `web-dom` | A browser, drawing as a document | 77 |
#! | `web` | A browser, document **and** WebGPU canvas | 210 |
#! | `android` | An Android `NativeActivity` | 299 |
#! | `headless` | No surface at all: draw commands in, pixels out | 174 |
#!
#! Counted with `cargo tree -p telar --no-default-features --features "<target>" -e normal --target all`,
#! so every platform's dependencies are in the figure at once. The spread is the point: nothing here is
#! bundled, so a build carries the target it named and no other.

## A native window on Linux, macOS and Windows, drawn by the GPU where there is one and the CPU where
## there is not. Enabled by `default`.
desktop = [
    "desktop-bare",
    "hardware",
    "software",
    "a11y",
    "clipboard-wayland",
    "dialogs",
    "system-theme",
]

## The terminal the app was launched from, drawn through `renderer-tui`. No window, no GPU and no glyph
## shaper.
tui = ["runtime", "dep:platform-tui", "dep:renderer-tui", "services-core/system-paths"]

## An Android `NativeActivity`, drawn by the GPU where there is one and the CPU where there is not. Opt-in
## like every other frontend: `runtime` used to bring it in unconditionally, which linked winit and an
## activity into terminal builds under Termux — ordinary command-line processes with no activity behind them.
android = ["android-bare", "hardware", "software"]

## A browser, drawing as a document: real elements laid out by CSS, measured with the browser's own
## canvas. No GPU and no shaper, which is most of what a web build used to weigh.
##
## Only meaningful for a `wasm32` build; the dependencies behind it are target-gated, so turning it on for
## a host build enables nothing.
web-dom = ["runtime", "dep:platform-web", "dep:renderer-dom"]

## Both browser frontends: the document above, and pixels on a canvas through WebGPU — what
## `WebRenderer::Auto` needs to have a choice to make. The canvas draws its own glyphs, hence the shaper.
web = ["web-dom", "shaper", "dep:renderer-web"]

## No surface at all: exposes `rasterize`, draw commands in and pixels out, with no window and no GPU.
headless = ["runtime", "software", "dep:platform-headless"]

#! ## Capabilities
#!
#! Optional runtime pieces, each off unless named. Every one of them is a dependency an application that
#! does not use it should not have to link.

## The widget catalogue: buttons, fields, menus, modals, tabs, sliders and the rest.
components = ["runtime", "dep:ui-components"]

## A reactive page stack with animated transitions.
navigate = ["runtime", "dep:navigate-core"]

## The `Svg` widget, drawing shapes baked at build time out of `src:"…"`. No SVG parser at runtime.
svg = ["ui-core?/svg"]

## The reactive seam for assets that arrive later: `AssetLoader` over the `AssetTransport` / `AssetCache` /
## `AssetDecoder` roles, which is reactive glue and nothing else — no decoder, no client, no format knobs.
##
## The implementations live in the companion crate `telar-dynamic`: SVG, bitmaps and translation catalogs
## as decoders, HTTP and a directory as transports, each behind its own feature there. Depending on it is
## how an application gets a format; implementing these three traits is how it gets one we do not ship, and
## the two go in through the same door.
async-assets = ["runtime", "ui-core/async-assets"]

## Dependency injection over the per-surface service scope.
di = ["services-core/di"]

## Loading a translation catalog from TOML instead of linking one the transpiler baked — what an
## application with no `.rsx` file in it needs to reach i18n at all.
##
## For a catalog that *arrives* rather than one you already hold — downloaded, or picked by the user — the
## same parser is behind `telar-dynamic`'s `catalog`, which routes it through the asset seam so a corrupt
## file fails before it is cached instead of after.
runtime-catalog = ["i18n-core/runtime-catalog"]

## Filesystem watching delivered on the UI thread. Opt-in: an application that reloads nothing should not
## link a platform file-notification backend.
watch = ["runtime", "dep:notify"]

#! ## Desktop extras
#!
#! Every one of these is in `desktop`, so a desktop build has the lot and nobody has to ask. They are
#! nameable so that `default-features = false` can finally leave one out — a kiosk with no file picker, a
#! packager who knows the target has XWayland — and for no other reason. Each is inert off the desktop.

## Screen-reader support, over AccessKit and the platform's own accessibility bus. The heaviest of the four
## by some way, and still the last one to turn off: what it costs is build time, and what it buys is an
## application a blind user can operate at all.
a11y = ["platform-desktop?/a11y"]

## The system clipboard: X11 on Linux, the native one on Windows and macOS.
clipboard = ["platform-desktop?/clipboard"]

## The clipboard on a Wayland session with no XWayland behind it, which X11's cannot reach. Costs
## `wl-clipboard-rs` and its tree; a build that knows XWayland is there can ask for plain `clipboard`.
clipboard-wayland = ["clipboard", "platform-desktop?/clipboard-wayland"]

## Native file pickers: the XDG portal on Linux, the OS panel elsewhere.
dialogs = ["platform-desktop?/dialogs"]

## Following the OS light/dark preference. Only ever compiled on Linux, over the freedesktop portal —
## Windows and macOS answer through winit and need no feature for it.
system-theme = ["platform-desktop?/system-theme"]

#! ## Set by the tooling
#!
#! `cargo telar` passes these on the command line for the command you ran. An application does not name
#! them, and nothing in a shipping binary should reach for them.

## Hot reload and the in-app devtools overlay. Injected by `cargo telar dev`. Takes the bare window rather
## than `desktop`, so `--target tui` does not acquire a GPU renderer on the way to a terminal.
dev = [
    "runtime",
    "desktop-bare",
    "platform-core/dylib",
    "dep:telar-devtools",
    "dep:libloading",
    "dep:serde_json",
]

## The dylib half of that loop, which only `cargo telar dev` turns on and only for a package that can produce
## one: `.rsx` signal declarations become keyed bindings whose values survive a swap, the runner exports the
## symbols the host swaps through, and `[telar.dev.window]` reaches the window. It was a `--cfg` pushed
## through `RUSTFLAGS`, which cargo hashes into every unit in the graph — so turning it on and off
## recompiled every dependency rather than the three crates that read it.
hot-reload = ["dev", "telar-macros/hot-reload"]

## Emitting the `[preview]` blocks at all, and the entry point that runs them. Injected by `cargo telar test`.
##
## The one that matters, because without it a `[preview]` is not compiled into anything: the transpiler emits
## a build fn per block only for the flavours that ask, and this is what asks. A build without it also has no
## `telar::dev_entry` in its `run()` — which is why a shipped binary no longer answers `TELAR_TEST=1` from
## whoever sets it, and no longer carries the preview harness or the markup of every block.
##
## Carries no frontend of its own: `cargo telar test` builds and lays a preview out without drawing it, and a
## terminal application must not acquire a window on the way to being tested.
previews = ["runtime", "telar-macros/preview"]

## The preview host that renders those blocks in a window. Injected by `cargo telar preview`.
preview = ["previews", "desktop-bare"]

## Rendering them to PNG with no window, which is `cargo telar preview --png <dir>`.
##
## Took `headless` alone until it was wired to a command, so it enabled a renderer for previews the build was
## never told to emit — `run_preview_png` was reachable only by setting a feature and an environment variable
## by hand, and rendered nothing when you did.
preview-headless = ["previews", "headless"]

## Test helpers an out-of-tree application needs to assert on what its tree drew, plus the GPU gate that
## keeps a pixel test from passing having asserted nothing.
testing = ["runtime"]

## Renders this feature list into the crate documentation. docs.rs only; never enable it yourself.
document-features = ["dep:document-features"]

#! ## Building blocks
#!
#! What the target features above are assembled from. An out-of-tree frontend installing its own platform
#! or renderer through `run_with_platform_and_renderer` names these directly; nothing else needs to.

## The kernel every frontend sits on: reactive graph, layout, theming, the widget tree and the draw
## vocabulary. No surface and no renderer.
runtime = [
    "dep:platform-core",
    "dep:renderer-core",
    "dep:renderer-assets",
    "dep:reactive-core",
    "dep:layout-core",
    "dep:theme-core",
    "dep:ui-core",
    "dep:ui-tree",
    "dep:geometry-core",
    "dep:toml",
    "dep:tracing",
    "dep:libc",
]

## Shaping glyphs out of font files, which is what a backend drawing its own text needs and what one
## handing text to somebody else's engine does not. Split out of `runtime` because it is the heaviest
## thing in a build that never uses it: cosmic-text, swash, skrifa and two `fontdb`s come with it, and a
## document renderer measures with the browser's own canvas instead.
shaper = ["runtime", "dep:renderer-text"]

## The wgpu renderer. `platform-headless` rides along because `TextureUi` names `HeadlessWindow` as its
## offscreen marker.
hardware = ["runtime", "shaper", "dep:renderer-hardware", "dep:platform-headless"]

## The CPU rasterizer, on `tiny-skia`.
software = ["runtime", "dep:renderer-software", "shaper"]

## A desktop window with no renderer behind it, for a frontend installing its own through
## `run_with_platform_and_renderer`. `RendererBackend::Auto` resolves to whichever of `hardware`/`software`
## is present, so a build with neither draws nothing.
desktop-bare = ["runtime", "dep:platform-desktop"]

## The same, for Android.
android-bare = ["runtime", "dep:platform-android"]

[dependencies]
geometry-core = { workspace = true, optional = true }
i18n-core = { workspace = true }
layout-core = { workspace = true, optional = true }
# Always-on (D2): the motion engine is small and dependency-free, and the facade must expose `motion::*` for transpiler codegen whatever else is off.
motion-core = { workspace = true }
navigate-core = { workspace = true, optional = true }
platform-core = { workspace = true, optional = true }
platform-headless = { workspace = true, optional = true }
platform-tui = { workspace = true, optional = true }
reactive-core = { workspace = true, optional = true }
renderer-assets = { workspace = true, optional = true }
renderer-core = { workspace = true, optional = true }
renderer-hardware = { workspace = true, optional = true }
renderer-software = { workspace = true, optional = true }
renderer-text = { workspace = true, optional = true }
renderer-tui = { workspace = true, optional = true }
services-core = { workspace = true }
telar-devtools = { workspace = true, optional = true }
telar-macros = { workspace = true }
theme-core = { workspace = true, optional = true }
ui-components = { workspace = true, optional = true }
ui-core = { workspace = true, optional = true }
ui-tree = { workspace = true, optional = true }

document-features = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
notify = { workspace = true, optional = true }
raw-window-handle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true }


# Excludes wasm as well as Android: `not(target_os = "android")` is true on wasm32, which would drag winit
# into a build that has no window server to talk to. A web build takes `--no-default-features`.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
platform-desktop = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
platform-android = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
platform-headless = { workspace = true }
renderer-record = { workspace = true }
# Self-referencing so the integration tests get the opt-in `testing` module without it being a default that
# ships in every binary. Nothing here covers an asset transport any more: `src/http_assets_test.rs` moved to
# `telar-dynamic` along with the transport it exercises.
telar = { path = ".", features = ["testing", "watch"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
platform-web = { workspace = true, optional = true }
renderer-dom = { workspace = true, optional = true }
renderer-web = { workspace = true, optional = true }

wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["HtmlElement"] }
