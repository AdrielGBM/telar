[package]
name = "telar-services-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Platform path providers and an optional dependency-injection scope for Telar."
keywords = ["telar", "services", "paths", "di", "ui"]
categories = ["gui", "filesystem"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
# Dependency-injection scope/registry. Off by default: ui-core turns it on for every surface it builds, and a platform crate that runs without ui-core has no scope to inject from.
di = ["dep:rustc-hash", "dep:thiserror"]
# The host OS's user directories. Opt-in: a target with no filesystem (the web) must not link a crate
# whose whole job is to name paths on one.
system-paths = ["dep:dirs"]
# Opening a URI by starting the system launcher (`xdg-open`, `open`, the Windows URL handler). Opt-in for the same reason: a browser has no process to start.
system-opener = []

[dependencies]
geometry-core = { workspace = true }
platform-core = { workspace = true }
reactive-core = { workspace = true }
reactive-local = { workspace = true }
renderer-core = { workspace = true }
semantics-core = { workspace = true }
wire-core = { workspace = true }

dirs = { version = "7.0.0", optional = true }
rustc-hash = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
test-process = { workspace = true }
wire-core = { workspace = true, features = ["golden"] }

serde_json = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
