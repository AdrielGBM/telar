[package]
name = "telar-i18n-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Runtime internationalization for Telar: baked message catalogs and a reactive active-locale signal."
keywords = ["telar", "i18n", "l10n", "locale", "reactive"]
categories = ["internationalization", "localization", "gui"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
reactive-core = { workspace = true }
toml = { workspace = true, optional = true }

[features]
# Parsing a catalog rather than linking a baked one. Opt-in because the baked path — every `.rsx` app — needs
# no parser at runtime, and this is the only thing in the crate with a dependency beyond reactive-core.
runtime-catalog = ["dep:toml"]
