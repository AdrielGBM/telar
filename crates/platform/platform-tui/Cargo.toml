[package]
name = "telar-platform-tui"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Terminal window, input and event loop for Telar's platform abstraction."
keywords = ["telar", "tui", "terminal", "platform", "crossterm"]
categories = ["command-line-interface", "os", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
geometry-core = { workspace = true }
platform-core = { workspace = true }
services-core = { workspace = true, features = ["system-paths"] }

# Without `derive-more`: it exists for `Display` on crossterm's own key and event enums, which nothing here formats.
crossterm = { version = "0.29.0", default-features = false, features = [
    "bracketed-paste",
    "events",
    "windows",
] }
tracing = { workspace = true }
