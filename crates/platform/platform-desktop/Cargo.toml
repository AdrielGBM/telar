[package]
name = "telar-platform-desktop"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Desktop platform backend for Telar: winit event loop, system paths and OS color-scheme detection."
keywords = ["telar", "desktop", "platform", "winit", "gui"]
categories = ["gui", "os"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
accesskit = "0.24.1"
accesskit_winit = "0.33.2"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
dirs = "6.0.0"
geometry-core = { workspace = true }
platform-core = { workspace = true }
platform-winit = { workspace = true }
renderer-core = { workspace = true }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
services-core = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.17.0"
