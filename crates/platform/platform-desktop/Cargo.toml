[package]
name = "telar-platform-desktop"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Desktop platform backend for Telar: winit event loop, system paths and OS color-scheme detection."
keywords = ["telar", "desktop", "platform", "winit", "gui"]
categories = ["gui", "os"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[features]
# All four on, so a desktop build is as complete as it has always been. They exist to be nameable, not to be off: what changes is that `default-features = false` finally leaves something out.
default = ["a11y", "clipboard-wayland", "dialogs", "system-theme"]
a11y = ["dep:accesskit", "dep:accesskit_winit"]
clipboard = ["dep:arboard"]
# X11's clipboard reaches a Wayland session only through XWayland. This covers a compositor without it, at the price of `wl-clipboard-rs`; a build that knows XWayland is there can keep plain `clipboard`.
clipboard-wayland = ["clipboard", "arboard/wayland-data-control"]
dialogs = ["dep:rfd"]
# Linux only, and the one thing winit does not answer there: Windows and macOS report the preference natively and need no feature.
system-theme = ["dep:zbus"]

[dependencies]
geometry-core = { workspace = true }
platform-core = { workspace = true }
platform-winit = { workspace = true }
renderer-core = { workspace = true }
services-core = { workspace = true, features = ["system-paths"] }

accesskit = { version = "0.25.0", optional = true }
accesskit_winit = { version = "0.34.0", optional = true }
arboard = { version = "3.6.1", default-features = false, optional = true }
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
], optional = true }
tracing = { workspace = true }
# `wayland-csd-adwaita-notitle` rather than the default `wayland-csd-adwaita`: same client-side frame, without the `ab_glyph`/`ttf-parser` pair that only draws the title text winit then hides behind our own.
winit = { workspace = true, features = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.17.0", optional = true }
