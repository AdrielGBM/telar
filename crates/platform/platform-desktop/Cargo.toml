[package]
name = "telar-platform-desktop"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Desktop platform backend for Telar: winit event loop, system paths and OS preference detection."
keywords = ["telar", "desktop", "platform", "winit", "gui"]
categories = ["gui", "os"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[features]
# All four on, so a desktop build is as complete as it has always been. They exist to be nameable, not to be off: what changes is that `default-features = false` finally leaves something out.
default = ["a11y", "clipboard-wayland", "dialogs", "system-theme"]
# Screen-reader support, over AccessKit and the platform's own accessibility bus. The heaviest of the four by some way, and the last one anybody should turn off.
a11y = ["dep:accesskit_winit", "dep:platform-accesskit"]
# The system clipboard: X11 on Linux, the native one on Windows and macOS. Without it a paste does nothing rather than failing loudly.
clipboard = ["dep:arboard"]
# X11's clipboard reaches a Wayland session only through XWayland. This covers a compositor without it, at the price of `wl-clipboard-rs`; a build that knows XWayland is there can keep plain `clipboard`.
clipboard-wayland = ["clipboard", "arboard/wayland-data-control"]
# Native file pickers: the XDG portal on Linux, the OS panel elsewhere. The cheapest of the four to drop — a kiosk that opens no files links `rfd` for nothing.
dialogs = ["dep:rfd"]
# Linux only: the freedesktop settings portal, which is where colour scheme, contrast, reduced motion and, where the desktop publishes it, the text scale come from there, over `zbus`. Windows and macOS answer through their own system APIs and need no feature.
system-theme = ["dep:zbus"]

[dependencies]
platform-accesskit = { workspace = true, optional = true }
platform-core = { workspace = true }
platform-winit = { workspace = true }
reactive-local = { workspace = true }
renderer-core = { workspace = true }
services-core = { workspace = true, features = ["system-opener", "system-paths"] }

accesskit_winit = { version = "0.34.0", optional = true }
arboard = { version = "3.6.1", default-features = false, optional = true }
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
], optional = true }
tracing = { workspace = true }
# `wayland-csd-adwaita-notitle` rather than the default `wayland-csd-adwaita`: same client-side frame, without the `ab_glyph`/`ttf-parser` pair that only draws the title text winit then hides behind our own.
winit = { workspace = true, features = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.17.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSLocale", "NSString", "block2", "NSNotification", "NSOperation", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
