[package]
name = "telar-embed"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Embedding a separately-compiled Telar UI inside a Telar application: the guest half an embedded app exports, and the loader a host drives it through."
keywords = ["telar", "embed", "dylib", "gui", "embedding"]
categories = ["gui", "api-bindings"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

# docs.rs builds with everything on, so the loader is documented beside the guest half rather than hidden
# behind the feature only a host enables.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
#! A guest and its host are two different builds of two different binaries, and each wants one half of this
#! crate. The guest half is the default because it is what the guest — the thing being written — needs.
default = ["guest"]

## The guest's own side: [`EmbeddedApp`](crate::EmbeddedApp), the driver that runs its tree in a surface of
## its own, and the [`embed!`](crate::embed) macro that exports the entries a host calls.
guest = []

## The host's side: [`load_embedded`](crate::load_embedded) and the handle it returns. Brings a dynamic loader,
## which is why it is not in `default` — an application that only *is* a guest never loads one.
host = ["guest", "platform-core/dylib", "dep:libloading", "dep:tracing"]

## For a guest that shapes its own text, as one built on `telar` with `shaper` does: the host hands the guest its font
## database to defer to, so the guest measures in the faces the host draws its frames in, and a face the guest adds
## while it runs is added to the host's first. Host and guest must agree on it, which the contract stamp checks.
shaper = ["dep:renderer-text"]

## Renders this feature list into the crate documentation. docs.rs only; never enable it yourself.
document-features = ["dep:document-features"]

[dependencies]
geometry-core = { workspace = true }
layout-core = { workspace = true }
motion-core = { workspace = true }
platform-core = { workspace = true }
preferences-core = { workspace = true }
reactive-core = { workspace = true }
renderer-core = { workspace = true }
renderer-text = { workspace = true, optional = true }
services-core = { workspace = true }
ui-core = { workspace = true }
ui-tree = { workspace = true }
wire-core = { workspace = true }

document-features = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true, optional = true }

[dev-dependencies]
renderer-text = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
