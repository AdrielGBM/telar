[package]
name = "telar-analyzer"
version.workspace = true
edition.workspace = true
# The `ra_ap_*` crates are pinned to one rust-analyzer snapshot, which tracks a much newer compiler than the framework needs.
rust-version = "1.95"
# Not on crates.io: the VS Code extension ships a prebuilt binary, and the exact `ra_ap_*` pins would rot for anyone running `cargo install`.
publish = false
description = "Language server for Telar's .rsx files: diagnostics, completion and component preview."
keywords = ["telar", "rsx", "lsp", "language-server", "ide"]
categories = ["development-tools", "text-editors"]
readme.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
telar-parser = { workspace = true }
telar-workspace = { workspace = true }
telar-transpiler = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
lsp-types = "0.97"
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
url = "2.5.8"
telar-diagnostics = { workspace = true, features = ["lsp"] }
ra_ap_ide = "=0.0.340"
ra_ap_ide_db = "=0.0.340"
ra_ap_load-cargo = "=0.0.340"
ra_ap_project_model = "=0.0.340"
ra_ap_vfs = "=0.0.340"
ra_ap_paths = "=0.0.340"
anyhow = "1.0.103"
ra_ap_proc_macro_api = "=0.0.340"
ra_ap_hir = "=0.0.340"
