[package]
name = "telar-analyzer"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
# Not on crates.io: the VS Code extension ships a prebuilt binary, and a git-pinned rust-analyzer would rot for anyone running `cargo install`.
publish = false
description = "Language server for Telar's .rsx files: diagnostics, completion and component preview."
keywords = ["telar", "rsx", "lsp", "language-server", "ide"]
categories = ["development-tools", "text-editors"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# The same baker `cargo telar bake` runs. The editor has to answer for a `src:"…"` before any build has,
# so it bakes for itself rather than showing an error the user cannot act on from where they are.
telar-baker = { workspace = true }
telar-diagnostics = { workspace = true, features = ["lsp"] }
telar-parser = { workspace = true }
telar-project = { workspace = true }
telar-transpiler = { workspace = true, features = ["transpile"] }

anyhow = "1.0.103"
lsp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
toml = { workspace = true }
url = "2.5.8"
rust-analyzer = { git = "https://github.com/rust-lang/rust-analyzer", rev = "5c156cdfb047ea171ba255dcdcd86236d98a389e", version = "0.0.0" }
paths = { git = "https://github.com/rust-lang/rust-analyzer", rev = "5c156cdfb047ea171ba255dcdcd86236d98a389e", version = "0.0.0" }
lsp-server = "0.7"
crossbeam-channel = "0.5.17"

[target."cfg(unix)".dependencies]
libc = { workspace = true }
