[package]
name = "telar-analyzer"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
# Not on crates.io: the VS Code extension ships a prebuilt binary, and the exact `ra_ap_*` pins would rot for anyone running `cargo install`.
publish = false
description = "Language server for Telar's .rsx files: diagnostics, completion and component preview."
keywords = ["telar", "rsx", "lsp", "language-server", "ide"]
categories = ["development-tools", "text-editors"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# The same baker `cargo telar bake` runs. The editor has to answer for a `src:"…"` before any build has,
# so it bakes for itself rather than showing an error the user cannot act on from where they are.
telar-baker = { workspace = true }
telar-diagnostics = { workspace = true }
telar-parser = { workspace = true }
telar-project = { workspace = true }
telar-transpiler = { workspace = true, features = ["transpile"] }

anyhow = "1.0.103"
lsp-types = { workspace = true }
ra_ap_hir = "=0.0.349"
ra_ap_ide = "=0.0.349"
ra_ap_ide_db = "=0.0.349"
ra_ap_load-cargo = "=0.0.349"
ra_ap_paths = "=0.0.349"
ra_ap_proc_macro_api = "=0.0.349"
ra_ap_project_model = "=0.0.349"
ra_ap_vfs = "=0.0.349"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
toml = { workspace = true }
url = "2.5.8"

[target."cfg(unix)".dependencies]
libc = { workspace = true }
