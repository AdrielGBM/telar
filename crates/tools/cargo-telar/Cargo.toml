[package]
name = "cargo-telar"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Cargo subcommand for Telar apps: dev server with hot reload, and packaging into native installers."
keywords = ["telar", "cargo", "cli", "gui", "hot-reload"]
categories = ["development-tools::cargo-plugins", "command-line-utilities", "gui"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
telar-baker = { workspace = true }
telar-parser = { workspace = true }
telar-transpiler = { workspace = true }

brotli = { version = "9.0.0", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
