[package]
name = "telar-macros"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Procedural macros that compile .rsx files into Telar components at build time."
keywords = ["telar", "rsx", "macros", "proc-macro", "ui"]
categories = ["development-tools::procedural-macro-helpers", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[lib]
proc-macro = true

[features]
## The `cargo telar dev` build shape: signal declarations become keyed bindings the dev host restores across a dylib swap, and the runner exports the symbols it swaps through. A feature and not an environment variable because cargo hashes features into the units that enable them, and does not track what a proc macro reads from its environment.
hot-reload = []

## The `cargo telar preview` entry point: the generated runner builds the preview host instead of the application.
preview = []

[dependencies]
telar-project = { workspace = true }

proc-macro2 = { workspace = true }
quote = "1"
syn = { workspace = true }

[[test]]
name = "props"
path = "src/props_test.rs"
