[package]
name = "telar-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros that compile .rsx files into Telar components at build time."
keywords = ["telar", "rsx", "macros", "proc-macro", "ui"]
categories = ["development-tools::procedural-macro-helpers", "gui"]
readme.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
telar-transpiler = { workspace = true }
