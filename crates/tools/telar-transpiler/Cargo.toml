[package]
name = "telar-transpiler"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Transpiles parsed .rsx documents into compilable Rust source for the Telar runtime."
keywords = ["telar", "rsx", "transpiler", "codegen", "ui"]
categories = ["development-tools::build-utils", "compilers", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
telar-parser = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
syn = { version = "3.0.4", features = ["full", "visit"] }
proc-macro2 = "1.0.107"

[dev-dependencies]
semantics-core = { workspace = true }
