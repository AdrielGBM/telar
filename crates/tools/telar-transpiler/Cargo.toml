[package]
name = "telar-transpiler"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Transpiles parsed .rsx documents into compilable Rust source for the Telar runtime."
keywords = ["telar", "rsx", "transpiler", "codegen", "ui"]
categories = ["development-tools::build-utils", "compilers", "gui"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# Always-on baker: renderer-assets (usvg/resvg/image) compiles into the proc-macro HOST only, never the app binary. `dynamic-svg`/`dynamic-image` are the host features that let the baker parse SVG / decode images at build time.
renderer-assets = { workspace = true, features = [
    "dynamic-svg",
    "dynamic-image",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
# The catalog model and its TOML grammar, shared with the runtime loader: the baker adds discovery and
# codegen on top, and parses nothing the runtime path would parse differently.
i18n-core = { workspace = true, features = ["runtime-catalog"] }
telar-parser = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
syn = { version = "3.0.4", features = ["full", "visit"] }
proc-macro2 = "1.0.107"

[dev-dependencies]
semantics-core = { workspace = true }
