[package]
name = "telar-transpiler"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Transpiles parsed .rsx documents into compilable Rust source for the Telar runtime."
keywords = ["telar", "rsx", "transpiler", "codegen", "ui"]
categories = ["development-tools::build-utils", "compilers", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
telar-parser = { workspace = true }

proc-macro2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true, features = ["visit"] }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
semantics-core = { workspace = true }
