[package]
name = "telar-baker"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Bakes .rsx asset references (SVG, image) into Rust source at build time, one baker per registered asset kind."
keywords = ["telar", "rsx", "assets", "codegen", "build-time"]
categories = ["development-tools::build-utils", "compilers"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# The catalog model and its TOML grammar, shared with the runtime loader: the baker adds discovery and codegen on top, and parses nothing the runtime path would parse differently.
i18n-core = { workspace = true, features = ["runtime-catalog"] }
# `bake` pulls in every format `image` ships (not just the PNG/JPEG an app build settles for): this crate
# compiles once per machine, so paying for every format here is what lets `cargo-telar` and `telar-analyzer`
# bake whatever an `.rsx` points at without asking an app to widen its own runtime decoder for it.
renderer-assets = { workspace = true, features = ["bake"] }
telar-parser = { workspace = true }
telar-transpiler = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Only to ask which formats it decodes, for the test that holds `ASSET_KINDS` to it. `default-features = false`
# because the answer must be whatever `renderer-assets` turned on, which cargo unifies into this same build —
# naming the formats again here would be a second list to keep in step, which is the bug the test exists to catch.
image = { workspace = true }

[[test]]
name = "formats"
path = "src/formats_test.rs"
