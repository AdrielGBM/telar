[package]
name = "telar-diagnostics"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Line-based diagnostic types shared across the Telar .rsx toolchain, with optional LSP conversion."
keywords = ["telar", "rsx", "diagnostics", "lsp", "tooling"]
categories = ["development-tools", "development-tools::debugging"]
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = []

## Converting a diagnostic into the LSP shape an editor reads. Off by default: the terminal reports the same
## diagnostics and has no use for `lsp-types`, and this crate is on `cargo-telar`'s path now.
lsp = ["dep:lsp-types"]

[dependencies]
telar-parser = { workspace = true }

lsp-types = { workspace = true, optional = true }
