[package]
name = "rsx"
version = "0.1.0"
edition = "2024"

[features]
default = ["runtime"]
dev = ["runtime", "dep:rsx-devtools", "dep:libloading", "dep:serde_json"]
runtime = [
    "dep:platform-core",
    "dep:renderer-core",
    "dep:renderer-assets",
    "dep:renderer-software",
    "dep:renderer-hardware",
    "dep:renderer-text",
    "dep:reactive-core",
    "dep:layout-core",
    "dep:theme-core",
    "dep:ui-core",
    "dep:ui-tree",
    "dep:geometry-core",
    "dep:devtools-core",
    "dep:toml",
    "dep:tracing",
    "dep:dirs",
    "dep:platform-winit",
    "dep:platform-android",
    "dep:libc",
]
preview = ["runtime"]
# Dependency-injection scope/registry, re-exported from services-core. Opt-in; no runtime path wires it yet.
di = ["services-core/di"]
# Both ui-core and renderer-assets are optional deps of this crate, so use `?/` to only forward the feature if `runtime` already pulled them in.
# SVG widget capability plus the baked `SvgData`/`SvgError` re-exports; does NOT pull usvg, so build-time static baking works with just this.
svg = ["ui-core?/svg"]
# Adds runtime SVG parsing (`SvgData::from_str` via usvg); implies `svg`.
dynamic-svg = ["svg", "renderer-assets?/dynamic-svg"]
# Runtime image decoding via the `image` crate (`renderer_assets::decode`).
dynamic-image = ["renderer-assets?/dynamic-image"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

platform-core = { workspace = true, optional = true }
renderer-core = { workspace = true, optional = true }
renderer-assets = { workspace = true, optional = true }
renderer-software = { workspace = true, optional = true }
renderer-hardware = { workspace = true, optional = true }
renderer-text = { workspace = true, optional = true }
reactive-core = { workspace = true, optional = true }
# Always-on (D2): the motion engine is small and dependency-free, and the `rsx` facade must always expose `motion::*` for transpiler codegen regardless of which optional features are active.
motion-core = { workspace = true }
services-core = { workspace = true }
layout-core = { workspace = true, optional = true }
theme-core = { workspace = true, optional = true }
ui-core = { workspace = true, optional = true }
ui-tree = { workspace = true, optional = true }
geometry-core = { workspace = true, optional = true }
devtools-core = { workspace = true, optional = true }
rsx-devtools = { workspace = true, optional = true }
rsx-macros = { workspace = true }
libloading = { version = "0.9.0", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = { version = "6.0.0", optional = true }
platform-winit = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
platform-android = { workspace = true, optional = true }

[target.'cfg(any(target_os = "android", unix))'.dependencies]
libc = { version = "0.2.186", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(rsx_hot_reload)',
    'cfg(rsx_preview)',
] }
