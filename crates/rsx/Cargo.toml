[package]
name = "rsx"
version = "0.1.0"
edition = "2024"

[features]
default = ["runtime"]
dev = ["rsx-devtools/devtools", "dep:libloading"]
runtime = [
    "dep:platform-core",
    "dep:renderer-core",
    "dep:renderer-software",
    "dep:renderer-hardware",
]
preview = ["runtime"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

platform-core = { workspace = true, optional = true }
renderer-core = { workspace = true, optional = true }
renderer-software = { workspace = true, optional = true }
renderer-hardware = { workspace = true, optional = true }
renderer-text = { workspace = true }
reactive-core = { workspace = true }
services-core = { workspace = true }
layout-core = { workspace = true }
theme-core = { workspace = true }
ui-core = { workspace = true }
ui-tree = { workspace = true }
geometry-core = { workspace = true }
rsx-devtools = { workspace = true }
rsx-macros = { workspace = true }
libloading = { version = "0.9.0", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "6.0.0"
platform-winit = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
platform-android = { workspace = true }

[target.'cfg(any(target_os = "android", unix))'.dependencies]
libc = "0.2.186"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(rsx_hot_reload)',
    'cfg(rsx_preview)',
] }
