[package]
name = "ui-core"
version = "0.1.0"
edition = "2024"

[dependencies]
geometry-core = { workspace = true }
layout-core = { workspace = true }
layout-reactive = { workspace = true }
platform-core = { workspace = true }
reactive-core = { workspace = true }
renderer-core = { workspace = true }
renderer-assets = { workspace = true }
renderer-text = { workspace = true }
theme-core = { workspace = true }
ui-tree = { workspace = true }

[features]
# Enables the `Svg` widget module only; it needs baked `SvgData` (always available), not usvg.
svg = []
# Adds runtime SVG parsing (`SvgData::from_str` via usvg); required to compile the widget's from_str-based tests.
dynamic-svg = ["svg", "renderer-assets/dynamic-svg"]
