[package]
name = "telar-ui-components"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "First-party widget catalogue for Telar: buttons, inputs, chips, accordions and more."
keywords = ["telar", "ui", "gui", "widgets", "components"]
categories = ["gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[features]
#! Three groups rather than one knob per widget: they share `shared.rs` and `scrim.rs`, and the graph between
#! them is what decides where a line can be drawn at all. `dropdown` stays in every build because `select` and
#! `list` read its row styles; `scrim` travels with the two overlays that draw one.
#!
#! `telar/components` turns all three on, so an application that names the catalogue gets what it always got.

default = []

## Anything that draws over the tree: menus, context menus, modals, drawers, tooltips and the scrim behind them.
overlays = []

## The window frame a desktop application draws itself — title bar, controls, resize edges. Inert anywhere
## else, which is the whole reason it is nameable: a terminal or a document has no chrome to draw.
chrome = []

## Reorderable lists, accordions and steppers.
advanced = []

[dependencies]
geometry-core = { workspace = true }
layout-core = { workspace = true }
motion-core = { workspace = true }
platform-core = { workspace = true }
reactive-core = { workspace = true }
renderer-core = { workspace = true }
telar-macros = { workspace = true }
theme-core = { workspace = true }
ui-core = { workspace = true }

web-time = { workspace = true }

[dev-dependencies]
renderer-text = { workspace = true }

[[test]]
name = "reachable"
path = "src/reachable_test.rs"
