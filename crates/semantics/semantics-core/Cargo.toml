[package]
name = "telar-semantics-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "What a thing in a Telar interface is: the roles a screen reader, a document and a terminal all describe the same box with."
keywords = ["telar", "accessibility", "semantics", "aria", "gui"]
categories = ["accessibility", "gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[features]
serde = ["dep:serde"]

[dependencies]
reactive-local = { workspace = true }
wire-core = { workspace = true }

icu_locale_core = { workspace = true, features = ["alloc"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
wire-core = { workspace = true, features = ["golden"] }
