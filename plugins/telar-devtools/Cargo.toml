[package]
name = "telar-devtools"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "The in-app devtools overlay for Telar: an FPS badge and panel, a component inspector and the build-error banner, built from telar-components."
keywords = ["telar", "devtools", "inspector", "gui", "debugging"]
categories = ["gui", "development-tools::debugging"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
telar = { workspace = true, features = ["runtime"] }
telar-components = { workspace = true, features = ["workbench"] }
tracing.workspace = true

web-time = { workspace = true }

[dev-dependencies]
telar = { workspace = true, features = ["runtime", "shaper", "testing"] }
