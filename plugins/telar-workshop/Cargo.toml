[package]
name = "telar-workshop"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "The component workshop for Telar: browse an application's previews, render each in an isolated canvas and edit its args live."
keywords = ["telar", "workshop", "preview", "components", "gui"]
categories = ["gui", "development-tools"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }
# A `[telar] library`: the icons its chrome names from Rust are baked into `.telar/`, which cargo leaves out of a package unless it is listed.
include = [
    "/README.md",
    "/telar.toml",
    "/src/**",
    "!/src/**/.telar/modules-hot.rs",
    "/.telar/build/**",
    "/.telar/build.json",
    "/.telar/i18n.rs",
    "/.telar/i18n.json",
    "/.telar/assets.rs",
    "/.telar/assets.json",
    "/.telar/icons-library.json",
]

[dependencies]
telar = { workspace = true, features = ["previews"] }
telar-components = { workspace = true, features = ["workbench", "overlays", "chrome"] }
telar-devtools.workspace = true
telar-navigate.workspace = true
theme-core.workspace = true
serde = { workspace = true, features = ["rc"] }
telar-icons.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
telar-project.workspace = true
web-time.workspace = true

[dev-dependencies]
telar = { workspace = true, features = ["headless", "dev", "testing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
telar = { workspace = true, features = ["web-dom"] }
