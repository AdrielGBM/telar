[package]
name = "telar-components"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "First-party widget catalogue for Telar: buttons, inputs, tags, accordions and more."
keywords = ["telar", "ui", "gui", "widgets", "components"]
categories = ["gui"]
readme = "README.md"
license = { workspace = true }
repository = { workspace = true }
# A `[telar] library`: the baked icons its widgets name from Rust ship in `.telar/`, which cargo leaves out of a package unless it is listed.
include = [
    "/README.md",
    "/telar.toml",
    "/src/**",
    "!/src/**/.telar/modules-hot.rs",
    "/.telar/build/**",
    "/.telar/build.json",
    "/.telar/i18n.rs",
    "/.telar/i18n.json",
    "/.telar/assets.rs",
    "/.telar/assets.json",
    "/.telar/icons-library.json",
]

# docs.rs builds with every feature on, so the pages show the `icon` props `telar-icons` draws and the `AssetLoader` conversions, rather than only what a build with no features carries.
[package.metadata.docs.rs]
all-features = true

[features]
#! A feature brings in a dependency, never a choice of widgets: every widget is in every build, and an application links only the ones it calls.

default = []

## Draws `icon:"set:name"` ids through `telar-icons`, baked with the application. Without it, icon buttons and icon tabs draw a Unicode stand-in read from the icon's name.
icons = ["dep:telar-icons"]

## Lets an `image` follow an `AssetLoader`: the state a load hands out converts into the picture an image shows.
async-assets = ["telar/async-assets"]

[dependencies]
telar = { workspace = true, features = ["runtime", "svg"] }
telar-icons = { workspace = true, optional = true }

web-time = { workspace = true }

[dev-dependencies]
telar = { workspace = true, features = ["previews", "shaper", "testing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
telar = { workspace = true, features = ["headless"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]

js-sys = { workspace = true }
telar = { workspace = true, features = ["web-dom"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "Element", "HtmlElement", "HtmlHeadElement", "Node", "Window"] }

[[test]]
name = "reachable"
path = "src/reachable_test.rs"

[[test]]
name = "audit"
path = "src/audit_test.rs"

[[test]]
name = "strings"
path = "src/strings_test.rs"

[[test]]
name = "strings_override"
path = "src/strings_override_test.rs"

[[test]]
name = "theme_extension"
path = "src/theme_extension_test.rs"

[[test]]
name = "play"
path = "src/play_test.rs"
