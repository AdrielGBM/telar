[workspace]
resolver = "3"
members = [
    "crates/platform/platform-core",
    "crates/platform/platform-winit",
    "crates/platform/platform-desktop",
    "crates/platform/platform-android",
    "crates/platform/platform-headless",
    "crates/renderer/renderer-core",
    "crates/renderer/renderer-assets",
    "crates/renderer/renderer-software",
    "crates/renderer/renderer-hardware",
    "crates/renderer/renderer-text",
    "crates/reactive/reactive-core",
    "crates/services/services-core",
    "crates/geometry/geometry-core",
    "crates/motion/motion-core",
    "crates/layout/layout-core",
    "crates/layout/layout-reactive",
    "crates/ui/theme-core",
    "crates/ui/ui-core",
    "crates/ui/ui-tree",
    "crates/telar",
    "crates/tools/cargo-telar",
    "crates/tools/telar-parser",
    "crates/tools/telar-transpiler",
    "crates/tools/devtools-core",
    "crates/tools/telar-devtools",
    "crates/tools/telar-analyzer",
    "crates/tools/telar-diagnostics",
    "crates/tools/telar-macros",
    "crates/tools/telar-workspace",
    "apps/sandbox",
    "apps/landing",
    "crates/ui/ui-components", "crates/i18n/i18n-core", "crates/navigate/navigate-core",
]

default-members = [
    "crates/platform/platform-core",
    "crates/platform/platform-winit",
    "crates/platform/platform-headless",
    "crates/renderer/renderer-core",
    "crates/renderer/renderer-assets",
    "crates/renderer/renderer-software",
    "crates/renderer/renderer-hardware",
    "crates/renderer/renderer-text",
    "crates/reactive/reactive-core",
    "crates/services/services-core",
    "crates/geometry/geometry-core",
    "crates/motion/motion-core",
    "crates/layout/layout-core",
    "crates/layout/layout-reactive",
    "crates/ui/theme-core",
    "crates/ui/ui-core",
    "crates/ui/ui-tree",
    "crates/telar",
    "crates/tools/cargo-telar",
    "crates/tools/telar-parser",
    "crates/tools/telar-transpiler",
    "crates/tools/devtools-core",
    "crates/tools/telar-devtools",
    "crates/tools/telar-diagnostics",
    "crates/tools/telar-macros",
    "crates/tools/telar-workspace",
    "apps/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdrielGBM/telar"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
thiserror = "2"
raw-window-handle = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = "0.3.23"
bytemuck = "1.25.0"
rustc-hash = "2.1.2"
wide = "1.4"
clru = "0.6.3"
smallvec = { version = "1.15.1", features = ["union"] }
lru = "0.18.0"
winit = "0.30"
tiny-skia = "0.12.0"

platform-core = { path = "crates/platform/platform-core" }
platform-winit = { path = "crates/platform/platform-winit" }
platform-desktop = { path = "crates/platform/platform-desktop" }
platform-android = { path = "crates/platform/platform-android" }
platform-headless = { path = "crates/platform/platform-headless" }
renderer-core = { path = "crates/renderer/renderer-core" }
renderer-assets = { path = "crates/renderer/renderer-assets" }
renderer-software = { path = "crates/renderer/renderer-software" }
renderer-hardware = { path = "crates/renderer/renderer-hardware" }
renderer-text = { path = "crates/renderer/renderer-text" }
reactive-core = { path = "crates/reactive/reactive-core" }
services-core = { path = "crates/services/services-core" }
geometry-core = { path = "crates/geometry/geometry-core" }
motion-core = { path = "crates/motion/motion-core" }
layout-core = { path = "crates/layout/layout-core" }
layout-reactive = { path = "crates/layout/layout-reactive" }
theme-core = { path = "crates/ui/theme-core" }
i18n-core = { path = "crates/i18n/i18n-core" }
ui-core = { path = "crates/ui/ui-core" }
ui-tree = { path = "crates/ui/ui-tree" }
ui-components = { path = "crates/ui/ui-components" }
navigate-core = { path = "crates/navigate/navigate-core" }
telar = { path = "crates/telar" }
devtools-core = { path = "crates/tools/devtools-core" }
telar-devtools = { path = "crates/tools/telar-devtools" }
telar-diagnostics = { path = "crates/tools/telar-diagnostics" }
telar-parser = { path = "crates/tools/telar-parser" }
telar-transpiler = { path = "crates/tools/telar-transpiler" }
telar-macros = { path = "crates/tools/telar-macros" }
telar-workspace = { path = "crates/tools/telar-workspace" }
