[workspace]
resolver = "3"
members = [
    "crates/platform/platform-core",
    "crates/platform/platform-winit",
    "crates/platform/platform-desktop",
    "crates/platform/platform-android",
    "crates/platform/platform-headless",
    "crates/renderer/renderer-core",
    "crates/renderer/renderer-assets",
    "crates/renderer/renderer-cache",
    "crates/renderer/renderer-record",
    "crates/renderer/renderer-software",
    "crates/renderer/renderer-hardware",
    "crates/renderer/renderer-text",
    "crates/reactive/reactive-core",
    "crates/services/services-core",
    "crates/geometry/geometry-core",
    "crates/motion/motion-core",
    "crates/layout/layout-core",
    "crates/layout/layout-reactive",
    "crates/ui/theme-core",
    "crates/ui/ui-core",
    "crates/ui/ui-tree",
    "crates/telar",
    "crates/tools/cargo-telar",
    "crates/tools/telar-parser",
    "crates/tools/telar-transpiler",
    "crates/tools/telar-analyzer",
    "crates/tools/telar-diagnostics",
    "crates/tools/telar-macros",
    "apps/sandbox",
    "apps/landing",
    "crates/ui/ui-components",
    "crates/i18n/i18n-core",
    "crates/navigate/navigate-core",
    "crates/reactive/reactive-local",
    "crates/i18n/i18n-fixture",
]

default-members = [
    "crates/platform/platform-core",
    "crates/platform/platform-winit",
    "crates/platform/platform-headless",
    "crates/renderer/renderer-core",
    "crates/renderer/renderer-assets",
    "crates/renderer/renderer-cache",
    "crates/renderer/renderer-record",
    "crates/renderer/renderer-software",
    "crates/renderer/renderer-hardware",
    "crates/renderer/renderer-text",
    "crates/reactive/reactive-core",
    "crates/services/services-core",
    "crates/geometry/geometry-core",
    "crates/motion/motion-core",
    "crates/layout/layout-core",
    "crates/layout/layout-reactive",
    "crates/ui/theme-core",
    "crates/ui/ui-core",
    "crates/ui/ui-tree",
    "crates/telar",
    "crates/tools/cargo-telar",
    "crates/tools/telar-parser",
    "crates/tools/telar-transpiler",
    "crates/tools/telar-diagnostics",
    "crates/tools/telar-macros",
    "apps/sandbox",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdrielGBM/telar"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Debug info for code nobody here is stepping through, and the bulk of what a hot reload relinks.
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
thiserror = "2"
raw-window-handle = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = "0.3.23"
bytemuck = "1.25.0"
rustc-hash = "2.1.2"
wide = "1.4"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
clru = "0.6.3"
smallvec = { version = "1.15.1", features = ["union"] }
lru = "0.18.0"
winit = "0.30"
tiny-skia = "0.12.0"
ureq = "3.4.0"
notify = "8.2.0"

# Every crate publishes as `telar-*`; the keys keep the short internal names so `use ui_core::…` and `dep:ui-core` feature syntax stay unchanged.
platform-core = { package = "telar-platform-core", path = "crates/platform/platform-core", version = "0.1.5" }
platform-winit = { package = "telar-platform-winit", path = "crates/platform/platform-winit", version = "0.1.5" }
platform-desktop = { package = "telar-platform-desktop", path = "crates/platform/platform-desktop", version = "0.1.5" }
platform-android = { package = "telar-platform-android", path = "crates/platform/platform-android", version = "0.1.5" }
platform-headless = { package = "telar-platform-headless", path = "crates/platform/platform-headless", version = "0.1.5" }
renderer-core = { package = "telar-renderer-core", path = "crates/renderer/renderer-core", version = "0.1.5" }
renderer-assets = { package = "telar-renderer-assets", path = "crates/renderer/renderer-assets", version = "0.1.5" }
renderer-cache = { package = "telar-renderer-cache", path = "crates/renderer/renderer-cache", version = "0.1.5" }
renderer-record = { package = "telar-renderer-record", path = "crates/renderer/renderer-record", version = "0.1.5" }
reactive-local = { package = "telar-reactive-local", path = "crates/reactive/reactive-local", version = "0.1.5" }
renderer-software = { package = "telar-renderer-software", path = "crates/renderer/renderer-software", version = "0.1.5" }
renderer-hardware = { package = "telar-renderer-hardware", path = "crates/renderer/renderer-hardware", version = "0.1.5" }
renderer-text = { package = "telar-renderer-text", path = "crates/renderer/renderer-text", version = "0.1.5" }
reactive-core = { package = "telar-reactive-core", path = "crates/reactive/reactive-core", version = "0.1.5" }
services-core = { package = "telar-services-core", path = "crates/services/services-core", version = "0.1.5" }
geometry-core = { package = "telar-geometry-core", path = "crates/geometry/geometry-core", version = "0.1.5" }
motion-core = { package = "telar-motion-core", path = "crates/motion/motion-core", version = "0.1.5" }
layout-core = { package = "telar-layout-core", path = "crates/layout/layout-core", version = "0.1.5" }
layout-reactive = { package = "telar-layout-reactive", path = "crates/layout/layout-reactive", version = "0.1.5" }
theme-core = { package = "telar-theme-core", path = "crates/ui/theme-core", version = "0.1.5" }
i18n-core = { package = "telar-i18n-core", path = "crates/i18n/i18n-core", version = "0.1.5" }
ui-core = { package = "telar-ui-core", path = "crates/ui/ui-core", version = "0.1.5" }
ui-tree = { package = "telar-ui-tree", path = "crates/ui/ui-tree", version = "0.1.5" }
ui-components = { package = "telar-ui-components", path = "crates/ui/ui-components", version = "0.1.5" }
navigate-core = { package = "telar-navigate-core", path = "crates/navigate/navigate-core", version = "0.1.5" }
telar = { path = "crates/telar", version = "0.1.5" }
telar-diagnostics = { path = "crates/tools/telar-diagnostics", version = "0.1.5" }
telar-parser = { path = "crates/tools/telar-parser", version = "0.1.5" }
telar-transpiler = { path = "crates/tools/telar-transpiler", version = "0.1.5" }
telar-macros = { path = "crates/tools/telar-macros", version = "0.1.5" }
