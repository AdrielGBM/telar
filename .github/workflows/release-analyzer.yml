name: Release telar-analyzer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: telar-analyzer
          - target: aarch64-apple-darwin
            # macos-latest is Apple Silicon (M-series); native ARM build avoids cross-compilation of ra_ap_* crates.
            os: macos-latest
            binary: telar-analyzer
          - target: x86_64-apple-darwin
            # macos-13 is the last GitHub-hosted Intel runner.
            os: macos-13
            binary: telar-analyzer
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: telar-analyzer.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build telar-analyzer
        run: cargo build --release --package telar-analyzer --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telar-analyzer-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename artifacts for release upload
        run: |
          mv artifacts/telar-analyzer-x86_64-unknown-linux-gnu/telar-analyzer   artifacts/telar-analyzer-x86_64-unknown-linux-gnu
          mv artifacts/telar-analyzer-aarch64-apple-darwin/telar-analyzer        artifacts/telar-analyzer-aarch64-apple-darwin
          mv artifacts/telar-analyzer-x86_64-apple-darwin/telar-analyzer         artifacts/telar-analyzer-x86_64-apple-darwin
          mv artifacts/telar-analyzer-x86_64-pc-windows-msvc/telar-analyzer.exe  artifacts/telar-analyzer-x86_64-pc-windows-msvc.exe

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/telar-analyzer-x86_64-unknown-linux-gnu
            artifacts/telar-analyzer-aarch64-apple-darwin
            artifacts/telar-analyzer-x86_64-apple-darwin
            artifacts/telar-analyzer-x86_64-pc-windows-msvc.exe

  # TODO(user): This job builds and publishes platform-specific VSIXs to the VS Code Marketplace.
  # Before enabling it:
  #   1. Go to https://marketplace.visualstudio.com/manage → publisher "telar".
  #   2. Create a Personal Access Token (PAT) with "Marketplace (Manage)" scope.
  #   3. Store it as a secret named VSCE_PAT in this repo (Settings → Secrets → Actions).
  #   4. Remove the `if: false` guard below.
  # Each VSIX bundles the target-native telar-analyzer binary inside server/ so the extension
  # can ship the precompiled binary without users needing cargo.
  publish-vsix:
    name: Publish VSIX (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce-target: linux-x64
            artifact: telar-analyzer-x86_64-unknown-linux-gnu
            binary: telar-analyzer
          - vsce-target: darwin-arm64
            artifact: telar-analyzer-aarch64-apple-darwin
            binary: telar-analyzer
          - vsce-target: darwin-x64
            artifact: telar-analyzer-x86_64-apple-darwin
            binary: telar-analyzer
          - vsce-target: win32-x64
            artifact: telar-analyzer-x86_64-pc-windows-msvc
            binary: telar-analyzer.exe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary for this platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Drop the binary into server/ so resolveServerPath() finds it in the installed extension.
          path: editors/vscode/telar/server/

      - name: Mark binary executable
        if: matrix.vsce-target != 'win32-x64'
        run: chmod +x editors/vscode/telar/server/${{ matrix.binary }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g pnpm

      - name: Install extension dependencies
        run: pnpm install
        working-directory: editors/vscode/telar

      - name: Compile extension
        run: pnpm run compile
        working-directory: editors/vscode/telar

      - name: Package and publish platform VSIX
        working-directory: editors/vscode/telar
        env:
          # TODO(user): set VSCE_PAT secret — see comment on this job above.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpx @vscode/vsce publish --target ${{ matrix.vsce-target }} --no-dependencies
