name: Release telar-analyzer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: telar-analyzer
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: telar-analyzer
          # Cross-compiled from the Apple Silicon runner rather than a native Intel one: GitHub retired
          # macos-13, so that label now queues until the 24h limit and takes the whole release with it.
          # Apple's SDK targets both architectures and this crate pulls no native dependencies.
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: telar-analyzer
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: telar-analyzer.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build telar-analyzer
        run: cargo build --release --package telar-analyzer --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telar-analyzer-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Flattened into a separate directory: each artifact downloads as `artifacts/<name>/<binary>`, so
      # renaming in place would move a file onto its own parent directory.
      - name: Rename artifacts for release upload
        run: |
          mkdir -p release
          mv artifacts/telar-analyzer-x86_64-unknown-linux-gnu/telar-analyzer   release/telar-analyzer-x86_64-unknown-linux-gnu
          mv artifacts/telar-analyzer-aarch64-apple-darwin/telar-analyzer       release/telar-analyzer-aarch64-apple-darwin
          mv artifacts/telar-analyzer-x86_64-apple-darwin/telar-analyzer        release/telar-analyzer-x86_64-apple-darwin
          mv artifacts/telar-analyzer-x86_64-pc-windows-msvc/telar-analyzer.exe release/telar-analyzer-x86_64-pc-windows-msvc.exe

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

  # Each VSIX bundles the target-native telar-analyzer binary inside server/ so the extension
  # can ship the precompiled binary without users needing cargo.
  # Open VSX is a separate registry (VSCodium, Cursor, Gitpod, Theia); the Microsoft marketplace
  # does not feed it. Its step is skipped until OVSX_PAT exists, so the release still goes out.
  publish-vsix:
    name: Publish VSIX (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    strategy:
      fail-fast: false
      # Serialized: the first platform to publish creates the extension, and concurrent jobs racing to
      # create it too are rejected with "already exists". Later ones only need to add their variant.
      max-parallel: 1
      matrix:
        include:
          - vsce-target: linux-x64
            artifact: telar-analyzer-x86_64-unknown-linux-gnu
            binary: telar-analyzer
          - vsce-target: darwin-arm64
            artifact: telar-analyzer-aarch64-apple-darwin
            binary: telar-analyzer
          - vsce-target: darwin-x64
            artifact: telar-analyzer-x86_64-apple-darwin
            binary: telar-analyzer
          - vsce-target: win32-x64
            artifact: telar-analyzer-x86_64-pc-windows-msvc
            binary: telar-analyzer.exe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary for this platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Drop the binary into server/ so resolveServerPath() finds it in the installed extension.
          path: editors/vscode/telar/server/

      - name: Mark binary executable
        if: matrix.vsce-target != 'win32-x64'
        run: chmod +x editors/vscode/telar/server/${{ matrix.binary }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g pnpm

      - name: Install extension dependencies
        run: pnpm install
        working-directory: editors/vscode/telar

      - name: Compile extension
        run: pnpm run compile
        working-directory: editors/vscode/telar

      # The tag is the single source of truth for the release, so the extension carries the same
      # number as the analyzer it bundles. The marketplace refuses a version it has already seen.
      - name: Take the version from the release tag
        working-directory: editors/vscode/telar
        run: pnpm pkg set version="${GITHUB_REF_NAME#v}"

      # Packaged once and published from the file, so both registries receive the identical artifact.
      - name: Package platform VSIX
        working-directory: editors/vscode/telar
        run: pnpx @vscode/vsce package --target ${{ matrix.vsce-target }} --no-dependencies -o telar-analyzer-${{ matrix.vsce-target }}.vsix

      - name: Publish to the VS Code Marketplace
        working-directory: editors/vscode/telar
        run: pnpx @vscode/vsce publish --packagePath telar-analyzer-${{ matrix.vsce-target }}.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode/telar
        run: pnpx ovsx publish telar-analyzer-${{ matrix.vsce-target }}.vsix
