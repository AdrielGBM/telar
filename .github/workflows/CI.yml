name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Every job that compiles `apps/sandbox` runs this first. A `src:"…"` asset resolves against the artifact
      # it writes, and the macro emits an error naming this command rather than baking one itself.
      - run: cargo run -q -p cargo-telar -- bake
      # Not `-D warnings`: the tree carries 247 of them today. This catches the `deny`-level lints, which is
      # what went unnoticed for two days when a `never_loop` in `telar-macros` stopped clippy reaching
      # anything downstream of it.
      - run: cargo clippy --workspace --all-targets --exclude telar-platform-android

  check-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so the test targets no other job compiles cannot rot unnoticed: `sandbox/dev` is off
      # in the `test` job, which leaves `apps/sandbox/tests/hot_tree.rs` — the only guard for the
      # split-runtime regression — never even type-checked.
      - run: cargo run -q -p cargo-telar -- bake
      - run: cargo check --workspace --all-features --all-targets --exclude telar-platform-android

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `rust-version` in [workspace.package].
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p cargo-telar -- bake
      - run: cargo check --workspace --all-features --exclude telar-platform-android

  check-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - run: cargo run -q -p cargo-telar -- bake
      # `sandbox`'s own default is `desktop`, so without this the job cross-compiled a winit build to Android and never touched the frontend it is named after.
      - run: cargo check -p sandbox --no-default-features --features sandbox/android -p telar-platform-android --target aarch64-linux-android --lib
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The only leg that compiles the document renderer, the WebGPU one and the web platform at all: they are
      # `cfg`'d to nothing off wasm, so every other check here passes with them broken.
      - run: cargo run -q -p cargo-telar -- bake
      - run: cargo check -p sandbox --lib --target wasm32-unknown-unknown --features telar/web

  # The document renderer is the one backend that positions nothing itself: CSS does, from what each box asked
  # layout for. Nothing but a browser can say whether that lands where Taffy computed, so this leg is where the
  # claim is actually checked — see `crates/renderer/renderer-dom/tests/layout_parity.rs`.
  parity-web-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The runner that serves the test module to a browser. Must be the release the pinned `wasm-bindgen`
      # crate generates glue for, which is why the version is written out here rather than resolved.
      - name: Install wasm-bindgen-test-runner
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C ~/.cargo/bin
      - name: Taffy against the browser
        # Chrome and its driver are already on the runner; `CHROMEWEBDRIVER` is where the image puts the latter.
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p telar-renderer-dom --target wasm32-unknown-unknown

  # `cargo telar new` is the first command a new user runs, and nothing else in this file compiles what it
  # writes: the `.rsx`, the theme derive and the app root live as string constants inside `cargo-telar`,
  # where a rename in the facade breaks them with nothing to notice. The generated projects are patched onto
  # this checkout rather than the published crate, so a break lands here instead of on the next person.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate a project per target, compile the two that need no extra toolchain
        run: |
          # Outside the repo so a generated project cannot pick up the workspace's lockfile, and shared
          # between them so the second compile reuses the first one's dependencies. Scoped to the scaffold's
          # own builds rather than exported, or building `cargo-telar` itself would leave the cached dir too.
          scaffold_target="$RUNNER_TEMP/scaffold-target"
          for target in desktop tui web android; do
            dir="$RUNNER_TEMP/scaffold-$target"
            rm -rf "$dir"
            echo "::group::cargo telar new --target $target"
            cargo run -q -p cargo-telar -- new "$dir" --target "$target"
            {
              echo
              echo '[patch.crates-io]'
              echo "telar = { path = \"$GITHUB_WORKSPACE/crates/telar\" }"
            } >> "$dir/Cargo.toml"
            # Resolving alone validates every `telar/<feature>` the manifest names, including the three
            # targets this project did not start on — a renamed feature fails here, compiling nothing.
            cargo metadata --format-version 1 --manifest-path "$dir/Cargo.toml" > /dev/null
            case "$target" in
              desktop | tui)
                CARGO_TARGET_DIR="$scaffold_target" cargo check --manifest-path "$dir/Cargo.toml"
                ;;
            esac
            echo "::endgroup::"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan adapter, so the 15 GPU tests run somewhere instead of skipping on every runner —
      # `crates/telar/tests/texture_ui.rs` is the only in-tree proof of the seam pixel-art builds on.
      # `TELAR_REQUIRE_GPU` below turns a missing adapter into a failure on this leg, so the suite cannot go
      # back to skipping silently.
      - name: Install lavapipe
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run -q -p cargo-telar -- bake
      - run: cargo test --workspace --exclude telar-platform-android
        env:
          TELAR_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # `plugin-host`, `headless` and `dev` are enabled by no workspace member, so the plugin bridge,
      # the offscreen rasteriser and the devtools overlay are never compiled by the line above — while the
      # first two ship in out-of-tree apps and the third is what every `cargo telar dev` session runs.
      - run: cargo test -p telar --features plugin-host,headless,dev
        env:
          TELAR_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  # Exercises `cargo telar build` per host OS: the raw binary everywhere plus each platform's native installer formats.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: dir deb appimage
          - os: macos-latest
            formats: dir dmg
          - os: windows-latest
            formats: dir nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Install NSIS
        if: runner.os == 'Windows'
        # The choco nsis package does not shim makensis, so its install dir must be appended to PATH by hand.
        # Chocolatey exits 0 having installed nothing when its feed 503s, so the binary is what decides, not the exit code.
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          foreach ($attempt in 1..3) {
            if (Test-Path "$nsis\makensis.exe") { break }
            if ($attempt -gt 1) { Start-Sleep -Seconds 30 }
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS did not install: no makensis.exe under $nsis after 3 attempts."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Add-Content -Path $env:GITHUB_PATH -Value "$nsis\Bin"
      - name: Package sandbox
        shell: bash
        # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run without FUSE on the runner.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          for format in ${{ matrix.formats }}; do
            echo "::group::cargo telar build --format $format"
            cargo run -p cargo-telar -- build --format "$format" --package sandbox
            echo "::endgroup::"
          done
          ls -R target/telar-dist
      - uses: actions/upload-artifact@v7
        with:
          name: telar-dist-${{ matrix.os }}
          path: |
            target/telar-dist/*.deb
            target/telar-dist/*.AppImage
            target/telar-dist/*.dmg
            target/telar-dist/*_setup.exe
          if-no-files-found: ignore
