name: CI

# Every job runs on every trigger: the repository is public, so GitHub's runners cost nothing here and nothing is held back for a manual run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: .github/scripts/check-layering.sh
      - name: No outside tool names
        run: "! git grep -il 'story[b]ook' -- ':!docs/plans'"
      - run: cargo clippy --workspace --all-targets --exclude telar-platform-android --exclude telar-analyzer --exclude telar-diagnostics -- -D warnings

  # `--all-targets` so the test targets no other job compiles cannot rot unnoticed: `sandbox/dev` is off in `test`, which would leave `apps/sandbox/src/hot_tree_test.rs`, the only guard for the split-runtime regression, never type-checked.
  check-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo check --workspace --all-features --all-targets --exclude telar-platform-android --exclude telar-analyzer --exclude telar-diagnostics

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          # Must match `rust-version` in [workspace.package].
          toolchain: 1.95.0
      - run: cargo check --workspace --all-features --exclude telar-platform-android --exclude telar-analyzer --exclude telar-diagnostics

  # The IDE server embeds rust-analyzer, 133 crates no application links and every other job excludes; a rename in `telar-transpiler` still breaks it, so it compiles once, alone.
  analyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy
          transpile: "false"
      - run: cargo clippy -p telar-analyzer -p telar-diagnostics --all-targets -- -D warnings
      - run: cargo test -p telar-analyzer -p telar-diagnostics

  # `cargo publish` verifies each package alone, without the features its workspace siblings unify onto it, so this is the only job that sees a crate the way the registry will; never `--no-verify`, and a bare runner like the one that publishes, so a crate linking a system library fails here rather than there.
  publishable:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          transpile: "false"
      # One call for every crate, because cargo verifies each package against the others of the same call and takes everything else from the registry; it transpiles, bakes and checks the packaged sources are committed first.
      - run: cargo run -q -p cargo-telar -- publish --workspace --dry-run

  check-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
      # `sandbox` defaults to `desktop`, so without these features this would cross-compile a winit build and never touch the Android frontend.
      - run: cargo check -p sandbox --no-default-features --features sandbox/android -p telar-platform-android --target aarch64-linux-android --lib
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

  # The only job that compiles the document renderer, the WebGPU one and the web platform at all: they are `cfg`'d to nothing off wasm.
  check-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p sandbox --lib --target wasm32-unknown-unknown --features telar/web

  # Only a browser can say whether CSS lands boxes where Taffy computed them, so this is where that claim is checked; see `crates/renderer/renderer-dom/src/layout_parity_test.rs`.
  parity-web-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - uses: ./.github/actions/axe-core
      - name: Taffy against Chrome
        # Chrome and its driver come with the runner image, which puts the driver at `CHROMEWEBDRIVER`.
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p telar-renderer-dom --target wasm32-unknown-unknown
          cargo test -p telar-components --target wasm32-unknown-unknown --test audit
      - name: Page Down against Firefox
        # Page Down can only be driven from wasm through Firefox's `scrollByPages`; the test runner prefers Chrome when both drivers are set, so only `GECKODRIVER` is exported.
        run: |
          export GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
          cargo test -p telar-renderer-dom --target wasm32-unknown-unknown --test arrival_margin

  # `apps/landing` ships to production as what `--profile web` plus `wasm-opt` produce, so this job builds it that way and holds its compressed size to `.github/size-budget/landing-web-dom.json`; see `docs/build-tuning.md`.
  web-size-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          transpile: "false"
      - uses: ./.github/actions/wasm-bindgen
      - uses: ./.github/actions/binaryen
      - run: .github/scripts/check-web-size.sh

  # `cargo telar new` is the first command a new user runs, and what it writes lives as string constants inside `cargo-telar`, so nothing else compiles it; the generated projects are patched onto this checkout so a break lands here.
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The generated projects compile the plugins from this checkout by path, so their `.rsx` and `icon!` ids have to be transpiled and baked first.
      - uses: ./.github/actions/rust
      - name: Generate a project per target, compile the two that need no extra toolchain
        run: |
          # Outside the repo so a generated project cannot pick up the workspace's lockfile, and shared so the second compile reuses the first one's dependencies.
          scaffold_target="$RUNNER_TEMP/scaffold-target"
          for target in desktop tui web android; do
            dir="$RUNNER_TEMP/scaffold-$target"
            rm -rf "$dir"
            echo "::group::cargo telar new --target $target"
            cargo run -q -p cargo-telar -- new "$dir" --target "$target"
            {
              echo
              echo '[patch.crates-io]'
              echo "telar = { path = \"$GITHUB_WORKSPACE/crates/telar\" }"
              echo "telar-components = { path = \"$GITHUB_WORKSPACE/plugins/telar-components\" }"
              echo "telar-devtools = { path = \"$GITHUB_WORKSPACE/plugins/telar-devtools\" }"
              echo "telar-workshop = { path = \"$GITHUB_WORKSPACE/plugins/telar-workshop\" }"
            } >> "$dir/Cargo.toml"
            # Resolving validates every `telar/<feature>` the manifest names, the other targets' included, so a renamed feature fails here.
            cargo metadata --format-version 1 --manifest-path "$dir/Cargo.toml" > /dev/null
            case "$target" in
              desktop | tui)
                CARGO_TARGET_DIR="$scaffold_target" cargo check --manifest-path "$dir/Cargo.toml"
                ;;
            esac
            # The runner `telar::app!` emits when `cargo telar dev` turns the overlay on, which no other job compiles.
            if [[ "$target" == desktop ]]; then
              CARGO_TARGET_DIR="$scaffold_target" cargo check --manifest-path "$dir/Cargo.toml" --features telar-devtools,telar/dev
              CARGO_TARGET_DIR="$scaffold_target" cargo check --manifest-path "$dir/Cargo.toml" --features telar-workshop,telar/preview
            fi
            echo "::endgroup::"
          done
      # The library scaffold's `include` decides whether its published crate carries the artifact a dependency compiles from, so it passes the same check a library member does.
      - name: Generate a library, check what it would package, compile it
        run: |
          dir="$RUNNER_TEMP/scaffold-lib"
          rm -rf "$dir"
          cargo run -q -p cargo-telar -- new "$dir" --lib
          {
            echo
            echo '[patch.crates-io]'
            echo "telar = { path = \"$GITHUB_WORKSPACE/crates/telar\" }"
          } >> "$dir/Cargo.toml"
          (cd "$dir" && cargo run -q --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p cargo-telar -- package --check)
          CARGO_TARGET_DIR="$RUNNER_TEMP/scaffold-target" cargo check --manifest-path "$dir/Cargo.toml"

  # A `[telar] library` is compiled by its consumers from the published package, read-only and without the CLI: `plugins/telar-rsx-fixture` is packaged, unpacked and built into a generated app in a target dir of its own, which is why `test` ignores it.
  rsx-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          transpile: "false"
      # Every cargo the test starts runs offline, so what `Cargo.lock` names has to be on disk first.
      - run: cargo fetch --locked
      - run: cargo test -p cargo-telar --test rsx_library -- --ignored

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Linux gets a software Vulkan adapter below, so a missing one there is a failure rather than a silent skip of the GPU tests.
      TELAR_REQUIRE_GPU: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - uses: ./.github/actions/rust
      - run: cargo test --workspace --exclude telar-platform-android --exclude telar-analyzer --exclude telar-diagnostics
      # No workspace member enables `headless` or `dev`, so the offscreen rasteriser and the `cargo telar dev` host compile nowhere else.
      - run: cargo test -p telar --features headless,dev
      # The workspace run has `telar/previews` on through `telar`'s dev-dependencies; built alone, the fixture proves Rust previews compile to nothing without it.
      - run: cargo test -p telar-rsx-fixture --test previews
      # Nothing in the workspace loads a plugin, so the host half of `telar-embed` compiles nowhere else.
      - run: cargo test -p telar-embed --all-features

  # Every preview of the three sample apps, built, played, audited and compared with its golden, drawn on the CPU rasteriser in each app's declared fonts so one runner decides.
  previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo run -q -p cargo-telar -- test -p catalogue --a11y error --report junit target/telar-snapshots/catalogue.xml
      - run: cargo run -q -p cargo-telar -- test -p sandbox --a11y error --report junit target/telar-snapshots/sandbox.xml
      - run: cargo run -q -p cargo-telar -- test -p landing --a11y error --report junit target/telar-snapshots/landing.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: telar-snapshots
          path: target/telar-snapshots/
          if-no-files-found: ignore

  # The catalogue's workshop exported as the static site `cargo telar preview --build` writes, kept as an artifact and audited page by page in Chrome with axe-core; see `crates/tools/cargo-telar/src/workshop_audit_test.rs`.
  workshop-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - uses: ./.github/actions/axe-core
      - run: cargo run -q -p cargo-telar -- preview -p catalogue --build "$RUNNER_TEMP/catalogue-site" --target web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalogue-site
          path: ${{ runner.temp }}/catalogue-site/
      - name: Audit every preview page
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p cargo-telar --test workshop_audit -- --ignored --nocapture
        env:
          TELAR_WORKSHOP_SITE: ${{ runner.temp }}/catalogue-site

  # `cargo telar build` per host OS: the raw binary everywhere plus each platform's native installer formats.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            formats: dir deb appimage
          - os: macos-15
            formats: dir dmg
          - os: windows-2025
            formats: dir nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          transpile: "false"
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        # The choco package does not shim makensis, and Chocolatey exits 0 having installed nothing when its feed 503s, so the binary on disk decides.
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          foreach ($attempt in 1..3) {
            if (Test-Path "$nsis\makensis.exe") { break }
            if ($attempt -gt 1) { Start-Sleep -Seconds 30 }
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS did not install: no makensis.exe under $nsis after 3 attempts."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Add-Content -Path $env:GITHUB_PATH -Value "$nsis\Bin"
      - name: Package sandbox
        env:
          # Lets appimagetool run without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          FORMATS: ${{ matrix.formats }}
        run: |
          for format in $FORMATS; do
            echo "::group::cargo telar build --format $format"
            cargo run -p cargo-telar -- build --format "$format" --package sandbox
            echo "::endgroup::"
          done
          ls -R target/telar-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telar-dist-${{ matrix.os }}
          path: |
            target/telar-dist/*.deb
            target/telar-dist/*.AppImage
            target/telar-dist/*.dmg
            target/telar-dist/*_setup.exe
          if-no-files-found: ignore

  # The one check branch protection and the release gate need to name: it fails when any job above failed, was cancelled or was skipped.
  ci-ok:
    if: ${{ !cancelled() }}
    needs:
      - lint
      - check-desktop
      - msrv
      - analyzer
      - publishable
      - check-android
      - check-web
      - parity-web-dom
      - web-size-budget
      - scaffold
      - rsx-library
      - test
      - previews
      - workshop-audit
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          unsuccessful=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$unsuccessful" ]; then
            echo "$unsuccessful"
            exit 1
          fi
