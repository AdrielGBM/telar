name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so the test targets no other job compiles cannot rot unnoticed: `sandbox/dev` is off
      # in the `test` job, which leaves `apps/sandbox/tests/hot_tree.rs` — the only guard for the
      # split-runtime regression — never even type-checked.
      - run: cargo check --workspace --all-features --all-targets --exclude telar-platform-android

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `rust-version` in [workspace.package].
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --exclude telar-platform-android

  check-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - run: cargo check -p sandbox -p telar-platform-android --target aarch64-linux-android --lib
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan adapter, so the 15 GPU tests run somewhere instead of skipping on every runner —
      # `crates/telar/tests/texture_ui.rs` is the only in-tree proof of the seam pixel-art builds on.
      # `TELAR_REQUIRE_GPU` below turns a missing adapter into a failure on this leg, so the suite cannot go
      # back to skipping silently.
      - name: Install lavapipe
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace --exclude telar-platform-android
        env:
          TELAR_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # `plugin-host`, `platform-headless` and `dev` are enabled by no workspace member, so the plugin bridge,
      # the offscreen rasteriser and the devtools overlay are never compiled by the line above — while the
      # first two ship in out-of-tree apps and the third is what every `cargo telar dev` session runs.
      - run: cargo test -p telar --features plugin-host,platform-headless,dev
        env:
          TELAR_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  # Exercises `cargo telar build` per host OS: the raw binary everywhere plus each platform's native installer formats.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: dir deb appimage
          - os: macos-latest
            formats: dir dmg
          - os: windows-latest
            formats: dir nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Install NSIS
        if: runner.os == 'Windows'
        # The choco nsis package does not shim makensis, so its install dir must be appended to PATH by hand.
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS\Bin"
      - name: Package sandbox
        shell: bash
        # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run without FUSE on the runner.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          for format in ${{ matrix.formats }}; do
            echo "::group::cargo telar build --format $format"
            cargo run -p cargo-telar -- build --format "$format" --package sandbox
            echo "::endgroup::"
          done
          ls -R target/telar-dist
      - uses: actions/upload-artifact@v7
        with:
          name: telar-dist-${{ matrix.os }}
          path: |
            target/telar-dist/*.deb
            target/telar-dist/*.AppImage
            target/telar-dist/*.dmg
            target/telar-dist/*_setup.exe
          if-no-files-found: ignore
