name: binaryen
description: Installs `wasm-opt` at the release the flake's devShell provides.

runs:
  using: composite
  steps:
    # Pinned because `wasm-opt`'s output size is part of what the size budget measures, and another optimiser release can move it with no source change.
    - run: |
        mkdir -p "$HOME/.local"
        curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check --strict
        tar -xz --strip-components=1 -C "$HOME/.local" -f "$RUNNER_TEMP/binaryen.tar.gz"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash
